spring.application.name=se327-mouse-jerry-backend
spring.profiles.active=db

# Spring Boot Docker Compose (disabled so external Supabase datasource is used)
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# DataSource (Supabase PostgreSQL / Local Fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool Optimization for Supabase (512MB RAM)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# Spring Session
spring.session.jdbc.initialize-schema=never

# Supabase S3 Storage Configuration
aws.s3.endpoint=${AWS_S3_ENDPOINT:https://djorohnniuxhnrjztdfq.storage.supabase.co/storage/v1/s3}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:}
aws.s3.region=${AWS_S3_REGION:ap-northeast-2}
aws.s3.bucket=${AWS_S3_BUCKET:mouse-jerry}
aws.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:https://djorohnniuxhnrjztdfq.storage.supabase.co/storage/v1/s3/mouse-jerry}


